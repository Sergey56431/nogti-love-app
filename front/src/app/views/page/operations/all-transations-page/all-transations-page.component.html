<div class="page-content">
  <h1 class="page-title mb-10">{{ _title }}</h1>

  <div class="operations-cards flex items-center flex-wrap gap-5 justify-center md:justify-start">
    @for (category of _categories; track category) {
      <a [routerLink]="'/' + category.route" [queryParams]="{type: 'all', period: 'all'}">
        <div class="operation-card"
             [ngStyle]="{ 'background-image': 'url(../../../../assets/images/operations/' + category.img + '.png)', 'width': '358px', 'height': '234px'}">
          <span>{{ category.name }}</span>
        </div>
      </a>
    }
  </div>
</div>
