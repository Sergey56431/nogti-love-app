<div class="page-content">
  <h1 class="page-title">{{ _title }}</h1>

  <div class="flex flex-col items-start gap-2">
    <div class="flex items-center">
      <p-select-button [options]="_typeFilters" [(ngModel)]="_type" (onChange)="_selectedTypeOrPeriod()"
                       optionLabel="label" optionValue="value" aria-labelledby="basic" [allowEmpty]="false"
                       size="large" />
    </div>

    <div class="flex items-center">
      <p-select-button [options]="_periodFilters" [(ngModel)]="_period" (onChange)="_selectedTypeOrPeriod()"
                       optionLabel="label" optionValue="value" aria-labelledby="basic" [allowEmpty]="false"
                       size="large" />
    </div>
  </div>

  <div>
    <p-button label="Добавить операцию" severity="success" icon="pi pi-plus" (onClick)="_createOperations()" class="mt-3" />
  </div>

  <div class="table-container mt-3">
    <p-table [value]="_operationsList()">
      <ng-template #header>
        <tr>
          <th>Тип</th>
          <th>Категория</th>
          <th>Значение</th>
          <th>Дата создания</th>
          <th>Дата обновления</th>
          <th>Опции</th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <th>{{item.type}}</th>
          <th>{{item.category}}</th>
          <th>{{item.value}}</th>
          <th>{{item.createdAt}}</th>
          <th>{{item.updatedAt}}</th>
          <th></th>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
