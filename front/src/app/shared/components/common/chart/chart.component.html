<div class="chart-content">
  <h2 class="chart-title chart-head">Мои операции</h2>
<!--  Добавить компонент для выбора месяца-->

  @if (_income() || _expanse()) {
    <p-chart type="doughnut" [data]="data" [options]="options" class="w-full md:w-[30rem]" />
    <div class="chart-title-and-option pb-4">
      <h2 class="chart-title">Даходы / Расходы</h2>
      <p-menu #menu [model]="_options" [popup]="true" />
      <p-button [rounded]="true"
                [text]="true"
                (click)="menu.toggle($event)"
                severity="contrast"
                icon="pi pi-ellipsis-v"/>
    </div>
  } @else {
    <h3 class="pt-2">Нет данных об операциях</h3>
  }
</div>
